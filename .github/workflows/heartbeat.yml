name: repo-heartbeat

# GitHub는 60일간 커밋이 없는 저장소의 스케줄 워크플로를 끈다.
# 주 1회 타임스탬프 커밋으로 활동을 유지해 핑이 영구히 돌게 한다.
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat" || exit 0
          git push
